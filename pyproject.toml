[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-voice"
version = "0.1.0a1"
description = "Local-first multi-session voice dashboard for Hermes Agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["hermes-agent", "voice-assistant", "local-first", "speech", "dashboard"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Multimedia :: Sound/Audio :: Speech"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "platformdirs>=4,<5", "python-multipart>=0.0.18", "PyYAML>=6"]

[project.optional-dependencies]
speech = ["faster-whisper>=1,<2", "edge-tts>=7,<8"]
# Optional local engine is GPL-3.0; model licenses are separate.
piper = ["piper-tts>=1.3,<2"]
test = ["pytest>=8", "build>=1", "ruff>=0.16,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.scripts]
hermes-voice = "hermes_voice.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_voice = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]
